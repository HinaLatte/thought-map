name: Save thought map entry

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  save-entry:
    if: contains(github.event.issue.labels.*.name, 'thought-map-entry')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare entry file
        id: prepare
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const issue = event.issue;
          const outputPath = process.env.GITHUB_OUTPUT;

          function setOutput(name, value) {
            fs.appendFileSync(outputPath, `${name}=${String(value).replace(/\r?\n/g, ' ')}\n`);
          }

          function basenameOnly(value) {
            return path.basename(String(value || '').trim());
          }

          function safeFileName(value) {
            const name = basenameOnly(value);
            if (!name || name === '.' || name === '..') {
              return '';
            }

            return name.endsWith('.md') ? name : `${name}.md`;
          }

          function markdownField(markdown, fieldName) {
            const pattern = new RegExp(`^${fieldName}:\\s*(.+)$`, 'm');
            const match = markdown.match(pattern);
            return match ? match[1].trim() : '';
          }

          const fileName = safeFileName(issue.title);
          if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}-map[0-9A-Za-z_-]+\.md$/.test(fileName)) {
            setOutput('duplicate', 'true');
            setOutput('error_message', `Issue title must be a file name like 2026-06-10-map001.md. Received: ${issue.title}`);
            process.exit(0);
          }

          const entriesDir = 'entries';
          const entryPath = path.join(entriesDir, fileName);

          if (fs.existsSync(entryPath)) {
            setOutput('duplicate', 'true');
            setOutput('error_message', `entries/${fileName} already exists. Rename the Issue title and open a new Issue.`);
            process.exit(0);
          }

          fs.mkdirSync(entriesDir, { recursive: true });

          const markdown = issue.body || '';
          fs.writeFileSync(entryPath, markdown.endsWith('\n') ? markdown : `${markdown}\n`, 'utf8');

          const indexPath = path.join(entriesDir, 'index.json');
          let index = [];
          if (fs.existsSync(indexPath)) {
            const rawIndex = fs.readFileSync(indexPath, 'utf8').trim();
            index = rawIndex ? JSON.parse(rawIndex) : [];
            if (!Array.isArray(index)) {
              index = [];
            }
          }

          const date = markdownField(markdown, 'date') || fileName.slice(0, 10);
          const title = markdownField(markdown, 'title') || fileName;

          index = index.filter((entry) => entry && entry.file !== fileName);
          index.push({ file: fileName, date, title });
          index.sort((a, b) => b.date.localeCompare(a.date) || b.file.localeCompare(a.file));

          fs.writeFileSync(indexPath, `${JSON.stringify(index, null, 2)}\n`, 'utf8');

          setOutput('duplicate', 'false');
          setOutput('file_name', fileName);
          NODE

      - name: Comment on duplicate or invalid entry
        if: steps.prepare.outputs.duplicate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ERROR_MESSAGE: ${{ steps.prepare.outputs.error_message }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="保存できませんでした。${ERROR_MESSAGE}"
          exit 1

      - name: Commit entry
        if: steps.prepare.outputs.duplicate == 'false'
        env:
          FILE_NAME: ${{ steps.prepare.outputs.file_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entries
          git commit -m "Add thought map entry ${FILE_NAME}"
          git push

      - name: Comment and close issue
        if: steps.prepare.outputs.duplicate == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FILE_NAME: ${{ steps.prepare.outputs.file_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="entries/${FILE_NAME} に保存しました。"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -X PATCH \
            -f state=closed
